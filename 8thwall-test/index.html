<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Halloween</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #muteButton {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    #muteButton svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    #tapToPlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      background: rgba(0, 0, 0, 0.001);
      color: transparent;
      font-size: 1px;
    }

    #tapToPlay.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <video id="halloweenVideo" src="./assets/Halloween.mp4" autoplay muted playsinline webkit-playsinline preload="auto"></video>
  <button id="muteButton" type="button" aria-label="Unmute video" aria-pressed="true"></button>
  <button id="tapToPlay" type="button" aria-label="Play video"></button>

  <script>
    const video = document.getElementById('halloweenVideo');
    const muteButton = document.getElementById('muteButton');
    const tapToPlay = document.getElementById('tapToPlay');
    const mutedIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="m16 9 5 5"></path><path d="m21 9-5 5"></path></svg>';
    const soundIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';

    function updateMuteButton() {
      muteButton.innerHTML = video.muted ? mutedIcon : soundIcon;
      muteButton.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
      muteButton.setAttribute('aria-pressed', String(video.muted));
    }

    async function playVideo() {
      video.muted = true;
      updateMuteButton();
      try {
        await video.play();
        tapToPlay.classList.remove('visible');
      } catch {
        video.muted = true;
        tapToPlay.classList.add('visible');
      }
    }

    video.addEventListener('ended', () => {
      if (Number.isFinite(video.duration) && video.duration > 0) {
        video.currentTime = Math.max(video.duration - 0.04, 0);
      }
      video.pause();
    });

    muteButton.addEventListener('click', async () => {
      video.muted = !video.muted;
      updateMuteButton();
      try {
        await video.play();
      } catch {
        video.muted = true;
        updateMuteButton();
      }
    });

    tapToPlay.addEventListener('click', playVideo);

    playVideo();
  </script>
</body>
</html>
