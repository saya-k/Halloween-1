<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Halloween</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #tapToPlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      background: rgba(0, 0, 0, 0.001);
      color: transparent;
      font-size: 1px;
    }

    #tapToPlay.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <video id="halloweenVideo" src="./assets/Halloween.mp4" autoplay muted playsinline webkit-playsinline preload="auto"></video>
  <button id="tapToPlay" type="button" aria-label="Play video"></button>

  <script>
    const video = document.getElementById('halloweenVideo');
    const tapToPlay = document.getElementById('tapToPlay');

    async function playVideo({ withSound = false } = {}) {
      if (withSound) video.muted = false;
      try {
        await video.play();
        tapToPlay.classList.remove('visible');
      } catch {
        video.muted = true;
        tapToPlay.classList.add('visible');
      }
    }

    video.addEventListener('ended', () => {
      if (Number.isFinite(video.duration) && video.duration > 0) {
        video.currentTime = Math.max(video.duration - 0.04, 0);
      }
      video.pause();
    });

    tapToPlay.addEventListener('click', () => playVideo({ withSound: true }));
    document.addEventListener('pointerdown', () => playVideo({ withSound: true }), { once: true });

    playVideo();
  </script>
</body>
</html>
